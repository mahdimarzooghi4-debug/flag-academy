name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: parcham
          POSTGRES_PASSWORD: parcham
          POSTGRES_DB: parcham
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U parcham -d parcham"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PARCHAM_DATABASE_URL: postgresql+asyncpg://parcham:parcham@localhost:5432/parcham
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend
        working-directory: backend
        run: pip install -e ".[dev]"
      - name: Lint
        working-directory: backend
        run: ruff check .
      - name: Type check
        working-directory: backend
        run: pyright app tests
      - name: Unit tests
        working-directory: backend
        run: pytest
      - name: Validate migrations
        working-directory: backend
        run: alembic upgrade head
      - name: Seed development data
        working-directory: backend
        run: python -m app.seed
      - name: Export OpenAPI
        working-directory: backend
        run: python scripts/export_openapi.py
      - uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: frontend/src/api/openapi.json

  frontend:
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/download-artifact@v4
        with:
          name: openapi
          path: frontend/src/api
      - name: Install frontend
        working-directory: frontend
        run: npm install
      - name: Generate API types
        working-directory: frontend
        run: npm run generate:api
      - name: Type check
        working-directory: frontend
        run: npm run typecheck
      - name: Unit tests
        working-directory: frontend
        run: npm test
      - name: Build
        working-directory: frontend
        run: npm run build
