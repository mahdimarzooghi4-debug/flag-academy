name: Stage Acceptance

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: parcham-stage-v1
  cancel-in-progress: true

jobs:
  ephemeral-stage:
    name: Ephemeral Stage Acceptance
    runs-on: ubuntu-latest
    environment: stage
    env:
      POSTGRES_USER: parcham
      POSTGRES_DB: parcham
      MINIO_ROOT_USER: parcham
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      PARCHAM_OIDC_ISSUER: http://localhost:8080/realms/parcham
      PARCHAM_OIDC_AUDIENCE: parcham-api
      PARCHAM_OIDC_JWKS_URL: http://localhost:8080/realms/parcham/protocol/openid-connect/certs
      PARCHAM_NATS_URL: nats://localhost:4222
      PARCHAM_CORS_ORIGINS: http://localhost:5173
      VITE_API_BASE_URL: http://localhost:8000
      VITE_OIDC_AUTHORITY: http://localhost:8080/realms/parcham
      VITE_OIDC_CLIENT_ID: parcham-web
      VITE_OIDC_REDIRECT_URI: http://localhost:5173
      E2E_BASE_URL: http://localhost:5173
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate ephemeral stage credentials
        shell: bash
        run: |
          make_secret() { python -c 'import secrets; print(secrets.token_urlsafe(24))'; }
          set_secret() {
            name="$1"
            value="$(make_secret)"
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          }
          set_secret POSTGRES_PASSWORD
          set_secret MINIO_ROOT_PASSWORD
          set_secret KC_BOOTSTRAP_ADMIN_PASSWORD
          set_secret PARCHAM_DEV_CANDIDATE_PASSWORD
          set_secret PARCHAM_DEV_INSTRUCTOR_PASSWORD
          set_secret PARCHAM_DEV_ADMIN_PASSWORD
          set_secret PARCHAM_DEV_ASSESSOR_PASSWORD

      - name: Build runtime database URL
        shell: bash
        run: |
          echo "PARCHAM_DATABASE_URL=postgresql+asyncpg://$POSTGRES_USER:$POSTGRES_PASSWORD@localhost:5432/$POSTGRES_DB" >> "$GITHUB_ENV"

      - name: Start clean stage dependencies
        run: docker compose -f infra/docker-compose.yml up -d postgres nats minio keycloak otel-collector

      - name: Wait for PostgreSQL
        shell: bash
        run: |
          until docker compose -f infra/docker-compose.yml exec -T postgres             pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"; do
            sleep 2
          done

      - name: Seed stage identities in live Keycloak
        run: ./scripts/dev-seed-keycloak.sh

      - name: Install backend and migrate clean database
        working-directory: backend
        run: |
          pip install -e ".[dev]"
          alembic upgrade head
          python -m app.seed

      - name: Start event workers
        working-directory: backend
        shell: bash
        run: |
          python -m app.read_models.consumer > /tmp/parcham-projector.log 2>&1 &
          echo $! > /tmp/parcham-projector.pid
          python -m app.evidence.consumer > /tmp/parcham-evidence.log 2>&1 &
          echo $! > /tmp/parcham-evidence.pid
          python -m app.platform.outbox > /tmp/parcham-outbox.log 2>&1 &
          echo $! > /tmp/parcham-outbox.pid

      - name: Start API
        working-directory: backend
        shell: bash
        run: |
          uvicorn app.main:app --host 0.0.0.0 --port 8000 > /tmp/parcham-api.log 2>&1 &
          echo $! > /tmp/parcham-api.pid
          for i in {1..60}; do
            if curl -fsS http://localhost:8000/ready >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/parcham-api.log
          exit 1

      - name: Install frontend and browser
        working-directory: frontend
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Start frontend
        working-directory: frontend
        shell: bash
        run: |
          npm run dev -- --host 0.0.0.0 > /tmp/parcham-web.log 2>&1 &
          echo $! > /tmp/parcham-web.pid
          for i in {1..60}; do
            if curl -fsS http://localhost:5173 >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/parcham-web.log
          exit 1

      - name: Run browser acceptance with live OIDC
        working-directory: frontend
        run: npm run e2e

      - name: Replay sealed observation delivery for evidence idempotency
        working-directory: backend
        shell: bash
        run: |
          python - <<'PY'
          import asyncio
          import json
          import os
          from uuid import uuid4

          import nats
          from sqlalchemy import func, select

          from app.config import get_settings
          from app.db import SessionFactory
          from app.evidence.consumer import CONSUMER_NAME
          from app.platform.models import InboxEvent, OutboxEvent

          async def main() -> None:
              async with SessionFactory() as db:
                  payload = (
                      await db.execute(
                          select(OutboxEvent.payload)
                          .where(OutboxEvent.event_type == "observation.sealed.v1")
                          .order_by(OutboxEvent.created_at)
                          .limit(1)
                      )
                  ).scalar_one()
                  inbox_before = (
                      await db.execute(
                          select(func.count())
                          .select_from(InboxEvent)
                          .where(InboxEvent.consumer_name == CONSUMER_NAME)
                      )
                  ).scalar_one()

              with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
                  env_file.write(f"EVIDENCE_REPLAY_INBOX_BEFORE={inbox_before}\n")

              nc = await nats.connect(get_settings().nats_url)
              try:
                  js = nc.jetstream()
                  subject = "parcham.events.observation.sealed.v1"
                  encoded = json.dumps(payload, default=str).encode()
                  await js.publish(subject, encoded)

                  replay = dict(payload)
                  replay["event_id"] = str(uuid4())
                  await js.publish(
                      subject,
                      json.dumps(replay, default=str).encode(),
                  )
              finally:
                  await nc.close()

          asyncio.run(main())
          PY
          sleep 3

      - name: Verify event and read-model acceptance
        shell: bash
        run: |
          for i in {1..30}; do
            runtime_observation_count=$(docker compose -f infra/docker-compose.yml exec -T postgres psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc "select count(*) from mission_runtime.observations;")
            evidence_case_count=$(docker compose -f infra/docker-compose.yml exec -T postgres psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc "select count(*) from evidence.evidence_cases;")
            evidence_replay_inbox_after=$(docker compose -f infra/docker-compose.yml exec -T postgres psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc "select count(*) from platform.inbox_events where consumer_name = 'evidence-observation-ingestor-v1';")
            if [ "$evidence_case_count" -ge "$runtime_observation_count" ] && [ "$evidence_replay_inbox_after" -ge "$((EVIDENCE_REPLAY_INBOX_BEFORE + 1))" ]; then
              break
            fi
            sleep 1
          done
          published=$(docker compose -f infra/docker-compose.yml exec -T postgres             psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc             "select count(*) from platform.outbox_events where published_at is not null;")
          inbox=$(docker compose -f infra/docker-compose.yml exec -T postgres             psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc             "select count(*) from platform.inbox_events;")
          candidate_home=$(docker compose -f infra/docker-compose.yml exec -T postgres             psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc             "select count(*) from readmodel.candidate_home;")
          instructor_home=$(docker compose -f infra/docker-compose.yml exec -T postgres             psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc             "select count(*) from readmodel.instructor_home;")
          completed_units=$(docker compose -f infra/docker-compose.yml exec -T postgres             psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc             "select count(*) from learning.learning_unit_progress where state = 'COMPLETED';")
          feedback_submissions=$(docker compose -f infra/docker-compose.yml exec -T postgres             psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc             "select count(*) from learning.submissions where status = 'FEEDBACK_PROVIDED';")
          learning_completed=$(docker compose -f infra/docker-compose.yml exec -T postgres             psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc             "select count(*) from readmodel.candidate_home ch, jsonb_array_elements(ch.payload->'what_to_learn') item where item->>'learning_state' = 'LEARNING_COMPLETED';")
          unproven=$(docker compose -f infra/docker-compose.yml exec -T postgres             psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc             "select count(*) from readmodel.candidate_home ch, jsonb_array_elements(ch.payload->'what_to_prove') item where item->>'proof_state' = 'UNPROVEN';")
          practice_attempts=$(docker compose -f infra/docker-compose.yml exec -T postgres             psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc             "select count(*) from learning.practice_attempts;")
          practice_feedback=$(docker compose -f infra/docker-compose.yml exec -T postgres             psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc             "select count(*) from learning.practice_feedback;")
          practice_feedback_provided=$(docker compose -f infra/docker-compose.yml exec -T postgres             psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc             "select count(*) from learning.practice_attempts where status = 'FEEDBACK_PROVIDED';")
          practice_replays=$(docker compose -f infra/docker-compose.yml exec -T postgres             psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc             "select count(*) from learning.practice_attempts where replay_of_attempt_id is not null;")
          practice_kinds=$(docker compose -f infra/docker-compose.yml exec -T postgres             psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc             "select count(distinct practice_kind) from learning.learning_units where phase = 'PRACTICE' and practice_kind is not null;")
          case_attempts=$(docker compose -f infra/docker-compose.yml exec -T postgres             psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc             "select count(*) from learning.practice_attempts pa join learning.learning_units lu on lu.id = pa.learning_unit_id where lu.practice_kind = 'CASE_STUDY';")
          active_missions=$(docker compose -f infra/docker-compose.yml exec -T postgres             psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc             "select count(*) from mission_design.mission_versions where status = 'ACTIVE';")
          mission_versions=$(docker compose -f infra/docker-compose.yml exec -T postgres             psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc             "select count(*) from mission_design.mission_versions;")
          mission_instances=$(docker compose -f infra/docker-compose.yml exec -T postgres             psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc             "select count(*) from mission_runtime.mission_instances;")
          completed_mission_instances=$(docker compose -f infra/docker-compose.yml exec -T postgres             psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc             "select count(*) from mission_runtime.mission_instances where status = 'COMPLETED';")
          mission_actions=$(docker compose -f infra/docker-compose.yml exec -T postgres             psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc             "select count(*) from mission_runtime.candidate_actions;")
          mission_decisions=$(docker compose -f infra/docker-compose.yml exec -T postgres             psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc             "select count(*) from mission_runtime.decision_records;")
          runtime_events=$(docker compose -f infra/docker-compose.yml exec -T postgres             psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc             "select count(*) from mission_runtime.runtime_events;")
          runtime_observations=$(docker compose -f infra/docker-compose.yml exec -T postgres             psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc             "select count(*) from mission_runtime.observations;")
          mission_assignments=$(docker compose -f infra/docker-compose.yml exec -T postgres             psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc             "select count(*) from mission_runtime.mission_assignments;")
          completed_mission_assignments=$(docker compose -f infra/docker-compose.yml exec -T postgres             psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc             "select count(*) from mission_runtime.mission_assignments where status = 'COMPLETED';")
          assignment_bound_instances=$(docker compose -f infra/docker-compose.yml exec -T postgres             psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc             "select count(*) from mission_runtime.mission_instances mi join mission_runtime.mission_assignments ma on ma.id = mi.assignment_id where ma.candidate_id = mi.candidate_id and ma.mission_version_id = mi.mission_version_id;")
          unassigned_instances=$(docker compose -f infra/docker-compose.yml exec -T postgres             psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc             "select count(*) from mission_runtime.mission_instances where assignment_id is null;")
          hidden_world_truth=$(docker compose -f infra/docker-compose.yml exec -T postgres             psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc             "select count(*) from mission_runtime.mission_instances where world_state #>> '{technical,root_cause_code}' = 'DOWNSTREAM_DEPENDENCY';")
          internal_simulation_seeds=$(docker compose -f infra/docker-compose.yml exec -T postgres             psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc             "select count(*) from mission_runtime.mission_instances where simulation_seed is not null;")
          internal_decision_effects=$(docker compose -f infra/docker-compose.yml exec -T postgres             psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc             "select count(*) from mission_runtime.runtime_events where event_type = 'decision.committed' and payload ? 'effect_applied';")
          actor_instances=$(docker compose -f infra/docker-compose.yml exec -T postgres             psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc             "select count(*) from mission_runtime.actor_instances;")
          actor_state_version_2=$(docker compose -f infra/docker-compose.yml exec -T postgres             psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc             "select count(*) from mission_runtime.actor_instances where state_version >= 2;")
          actor_aligned=$(docker compose -f infra/docker-compose.yml exec -T postgres             psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc             "select count(*) from mission_runtime.actor_instances where (state->>'trust_toward_candidate')::int = 60 and (state->>'current_frustration')::int = 40;")
          hidden_actor_state=$(docker compose -f infra/docker-compose.yml exec -T postgres             psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc             "select count(*) from mission_runtime.actor_instances where state->>'private_escalation_threshold' = 'LOW';")
          communicate_actions=$(docker compose -f infra/docker-compose.yml exec -T postgres             psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc             "select count(*) from mission_runtime.candidate_actions where action_type = 'COMMUNICATE';")
          actor_response_events=$(docker compose -f infra/docker-compose.yml exec -T postgres             psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc             "select count(*) from mission_runtime.runtime_events where event_type = 'actor.responded';")
          internal_actor_effects=$(docker compose -f infra/docker-compose.yml exec -T postgres             psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc             "select count(*) from mission_runtime.runtime_events where event_type = 'actor.responded' and payload ? 'actor_effect_applied';")
          actor_observations=$(docker compose -f infra/docker-compose.yml exec -T postgres             psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc             "select count(*) from mission_runtime.observations where observation_type = 'ACTOR_RESPONSE_OBSERVED';")
          experiment_actions=$(docker compose -f infra/docker-compose.yml exec -T postgres             psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc             "select count(*) from mission_runtime.candidate_actions where action_type = 'RUN_EXPERIMENT';")
          experiment_requested_events=$(docker compose -f infra/docker-compose.yml exec -T postgres             psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc             "select count(*) from mission_runtime.runtime_events where event_type = 'experiment.requested';")
          experiment_completed_events=$(docker compose -f infra/docker-compose.yml exec -T postgres             psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc             "select count(*) from mission_runtime.runtime_events where event_type = 'experiment.completed';")
          internal_experiment_contract=$(docker compose -f infra/docker-compose.yml exec -T postgres             psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc             "select count(*) from mission_runtime.runtime_events where event_type = 'experiment.completed' and payload ? 'contract' and payload ? 'result' and payload ? 'world_effect_applied' and payload #>> '{result,control_measurements,error_rate_percent}' = '13' and payload #>> '{result,treatment_measurements,error_rate_percent}' = '5';")
          experiment_interpretation_keys=$(docker compose -f infra/docker-compose.yml exec -T postgres             psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc             "select count(*) from mission_runtime.runtime_events where event_type = 'experiment.completed' and ((payload->'result') ? 'interpretation' or (payload->'result') ? 'verdict' or (payload->'result') ? 'evidence_strength' or (payload->'result') ? 'capability_score' or (payload->'result') ? 'gate_decision');")
          experiment_observations=$(docker compose -f infra/docker-compose.yml exec -T postgres             psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc             "select count(*) from mission_runtime.observations where observation_type = 'EXPERIMENT_RESULT_OBSERVED';")
          experiment_world_state=$(docker compose -f infra/docker-compose.yml exec -T postgres             psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc             "select count(*) from mission_runtime.mission_instances where world_state #>> '{mission,experiment_status}' = 'COMPLETED' and world_state #>> '{mission,accountability_owner}' = 'CANDIDATE';")
          resource_allocation_actions=$(docker compose -f infra/docker-compose.yml exec -T postgres             psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc             "select count(*) from mission_runtime.candidate_actions where action_type = 'ALLOCATE_RESOURCE';")
          pinned_resource_cost_actions=$(docker compose -f infra/docker-compose.yml exec -T postgres             psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc             "select count(*) from mission_runtime.candidate_actions where action_type = 'ALLOCATE_RESOURCE' and resource_cost->>'engineering_capacity_units' = '2';")
          resource_allocation_requested_events=$(docker compose -f infra/docker-compose.yml exec -T postgres             psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc             "select count(*) from mission_runtime.runtime_events where event_type = 'resource_allocation.requested';")
          resource_allocation_accepted_events=$(docker compose -f infra/docker-compose.yml exec -T postgres             psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc             "select count(*) from mission_runtime.runtime_events where event_type = 'resource_allocation.accepted';")
          internal_resource_allocation_contract=$(docker compose -f infra/docker-compose.yml exec -T postgres             psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc             "select count(*) from mission_runtime.runtime_events where event_type = 'resource_allocation.accepted' and payload->>'available_path' = 'resources.engineering_capacity.available_units' and payload->>'allocated_path' = 'delivery.recovery_capacity_units' and (payload->>'from_available')::int = 3 and (payload->>'to_available')::int = 1 and (payload->>'from_allocated')::int = 0 and (payload->>'to_allocated')::int = 2 and payload ? 'resource_cost_applied' and payload ? 'world_effect_applied';")
          resource_allocation_observations=$(docker compose -f infra/docker-compose.yml exec -T postgres             psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc             "select count(*) from mission_runtime.observations where observation_type = 'RESOURCE_ALLOCATION_OBSERVED';")
          allocated_resource_world_state=$(docker compose -f infra/docker-compose.yml exec -T postgres             psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc             "select count(*) from mission_runtime.mission_instances where world_state #>> '{mission,resource_allocation_status}' = 'ACTIVE' and world_state #>> '{mission,accountability_owner}' = 'CANDIDATE' and (world_state #>> '{resources,engineering_capacity,available_units}')::int = 1 and (world_state #>> '{delivery,recovery_capacity_units}')::int = 2;")
          scope_change_actions=$(docker compose -f infra/docker-compose.yml exec -T postgres             psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc             "select count(*) from mission_runtime.candidate_actions where action_type = 'CHANGE_SCOPE';")
          scope_change_requested_events=$(docker compose -f infra/docker-compose.yml exec -T postgres             psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc             "select count(*) from mission_runtime.runtime_events where event_type = 'scope_change.requested';")
          scope_change_accepted_events=$(docker compose -f infra/docker-compose.yml exec -T postgres             psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc             "select count(*) from mission_runtime.runtime_events where event_type = 'scope_change.accepted';")
          internal_scope_change_effects=$(docker compose -f infra/docker-compose.yml exec -T postgres             psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc             "select count(*) from mission_runtime.runtime_events where event_type = 'scope_change.accepted' and payload ? 'world_effect_applied';")
          internal_scope_change_contract=$(docker compose -f infra/docker-compose.yml exec -T postgres             psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc             "select count(*) from mission_runtime.runtime_events where event_type = 'scope_change.accepted' and payload->>'scope_path' = 'delivery.scope' and payload->>'from_scope' = 'FULL_ROLLOUT' and payload->>'to_scope' = 'CRITICAL_CUSTOMERS_ONLY';")
          scope_change_observations=$(docker compose -f infra/docker-compose.yml exec -T postgres             psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc             "select count(*) from mission_runtime.observations where observation_type = 'SCOPE_CHANGE_OBSERVED';")
          scoped_world_state=$(docker compose -f infra/docker-compose.yml exec -T postgres             psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc             "select count(*) from mission_runtime.mission_instances where world_state #>> '{mission,scope_change_status}' = 'ACTIVE' and world_state #>> '{mission,accountability_owner}' = 'CANDIDATE' and world_state #>> '{delivery,scope}' = 'CRITICAL_CUSTOMERS_ONLY';")
          delegation_actions=$(docker compose -f infra/docker-compose.yml exec -T postgres             psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc             "select count(*) from mission_runtime.candidate_actions where action_type = 'DELEGATE';")
          delegation_requested_events=$(docker compose -f infra/docker-compose.yml exec -T postgres             psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc             "select count(*) from mission_runtime.runtime_events where event_type = 'delegation.requested';")
          delegation_accepted_events=$(docker compose -f infra/docker-compose.yml exec -T postgres             psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc             "select count(*) from mission_runtime.runtime_events where event_type = 'delegation.accepted';")
          internal_delegation_effects=$(docker compose -f infra/docker-compose.yml exec -T postgres             psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc             "select count(*) from mission_runtime.runtime_events where event_type = 'delegation.accepted' and payload ? 'world_effect_applied' and payload ? 'actor_effect_applied';")
          delegation_observations=$(docker compose -f infra/docker-compose.yml exec -T postgres             psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc             "select count(*) from mission_runtime.observations where observation_type = 'DELEGATION_OBSERVED';")
          delegated_world_state=$(docker compose -f infra/docker-compose.yml exec -T postgres             psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc             "select count(*) from mission_runtime.mission_instances where world_state #>> '{mission,delegation_status}' = 'ACTIVE' and world_state #>> '{mission,accountability_owner}' = 'CANDIDATE' and world_state #>> '{delivery,recovery_coordinator}' = 'DELIVERY_LEAD';")
          delegated_actor_state=$(docker compose -f infra/docker-compose.yml exec -T postgres             psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc             "select count(*) from mission_runtime.actor_instances where actor_key = 'delivery_lead' and state_version >= 2 and state->>'commitment' = 'OWNS_RECOVERY_COORDINATION' and state->>'delegated_responsibility' = 'RECOVERY_COORDINATION';")
          hidden_delivery_actor_state=$(docker compose -f infra/docker-compose.yml exec -T postgres             psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc             "select count(*) from mission_runtime.actor_instances where actor_key = 'delivery_lead' and state->>'private_delivery_risk' = 'MEDIUM';")
