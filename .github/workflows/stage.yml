      - name: Upload stage acceptance evidence
        uses: actions/upload-artifact@v4
        with:
          name: stage-acceptance-evidence
          path: stage-artifacts/acceptance.txt

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: stage-diagnostics
          path: |
            frontend/playwright-report
            frontend/test-results
            /tmp/parcham-api.log
            /tmp/parcham-web.log
            /tmp/parcham-outbox.log
            /tmp/parcham-projector.log
          if-no-files-found: ignore

      - name: Destroy ephemeral stage
        if: always()
        run: docker compose -f infra/docker-compose.yml down -v
